name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    # Keep the OS used by the validated release, not a moving latest alias.
    runs-on: ubuntu-26.04

    steps:
      - name: Configure initial Git branch on the ephemeral runner
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: npm --prefix frontend run test -- --run

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check shared UI parity and untranslated UI
        run: |
          node scripts/check-shared-ui-parity.mjs
          node scripts/check-untranslated-ui.mjs

      - name: Install Chromium for Java browser tests
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Test shared frontend against Java API
        env:
          SMART_INVENTORY_BACKEND: java
        run: npm --prefix frontend run test:e2e

      - name: Package frontend and backend as one JAR
        working-directory: backend
        run: ./mvnw clean package

      - name: Verify packaged application
        run: |
          test -f backend/target/smart-inventory-demo.jar
          jar tf backend/target/smart-inventory-demo.jar > "$RUNNER_TEMP/jar-contents.txt"
          grep -Fx 'BOOT-INF/classes/static/index.html' "$RUNNER_TEMP/jar-contents.txt"

  rust-compatibility:
    name: Rust backend and shared browser tests
    runs-on: ubuntu-26.04

    steps:
      - name: Configure initial Git branch on the ephemeral runner
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Rust formatting
        working-directory: backend-rust
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: backend-rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: backend-rust
        run: cargo test --locked

      - name: Build Rust release
        working-directory: backend-rust
        run: cargo build --locked --release --bin smart-inventory-server

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build shared frontend
        run: npm --prefix frontend run build

      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Test shared frontend against Rust API
        env:
          SMART_INVENTORY_BACKEND: rust
        run: npm --prefix frontend run test:e2e

  site-runtime:
    name: Site Worker, D1, R2 and shared browser tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Configure initial Git branch on the ephemeral runner
        run: git config --global init.defaultBranch main

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            frontend/package-lock.json

      - name: Install Site dependencies
        working-directory: site
        run: npx --yes npm@11.6.2 ci

      - name: Test Site tooling and domain rules
        run: npm --prefix site test

      - name: Lint and type-check Site
        run: npm --prefix site run lint

      - name: Build actual Site Worker and client
        run: npm --prefix site run build

      - name: Test built Worker against fresh local D1 and R2
        run: npm --prefix site run test:integration

      - name: Install shared browser dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Test shared frontend against built Site Worker
        working-directory: frontend
        run: npm exec -- playwright test --config playwright.site.config.ts
