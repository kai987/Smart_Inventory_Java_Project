name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend unit tests
        run: npm --prefix frontend run test -- --run

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check shared UI parity and untranslated UI
        run: |
          node scripts/check-shared-ui-parity.mjs
          node scripts/check-untranslated-ui.mjs

      - name: Package frontend and backend as one JAR
        working-directory: backend
        run: ./mvnw clean package

      - name: Verify packaged application
        run: |
          test -f backend/target/smart-inventory-demo.jar
          jar tf backend/target/smart-inventory-demo.jar > "$RUNNER_TEMP/jar-contents.txt"
          grep -Fx 'BOOT-INF/classes/static/index.html' "$RUNNER_TEMP/jar-contents.txt"

      - name: Install Sites dependencies
        working-directory: site
        run: npx --yes npm@11.6.2 ci

      - name: Test Sites domain rules
        run: npm --prefix site run test

      - name: Lint Sites deployment
        run: npm --prefix site run lint

      - name: Build Sites deployment
        run: npm --prefix site run build

  rust-compatibility:
    name: Rust backend and shared browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Rust formatting
        working-directory: backend-rust
        run: cargo fmt --all -- --check

      - name: Lint Rust
        working-directory: backend-rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: backend-rust
        run: cargo test --locked

      - name: Build Rust release
        working-directory: backend-rust
        run: cargo build --locked --release --bin smart-inventory-server

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build shared frontend
        run: npm --prefix frontend run build

      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium

      - name: Test shared frontend against Rust API
        env:
          SMART_INVENTORY_BACKEND: rust
        run: npm --prefix frontend run test:e2e
