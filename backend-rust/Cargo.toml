[package]
name = "smart-inventory-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "API-compatible Rust backend for the Smart Inventory classroom demo"
license = "MIT"
publish = false

[lib]
name = "smart_inventory_rust"
path = "src/lib.rs"

[[bin]]
name = "smart-inventory-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
