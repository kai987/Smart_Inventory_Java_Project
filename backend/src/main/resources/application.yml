app:
  data-dir: ${SMART_INVENTORY_DATA_DIR:./runtime-data}
  low-stock-threshold: 5
  allowed-origins: ${SMART_INVENTORY_ALLOWED_ORIGINS:http://localhost:5173}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SMART_INVENTORY_SECURE_COOKIE:false}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
