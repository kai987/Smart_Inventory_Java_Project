<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inventory, orders, and packing management." />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Smart Inventory</title>
    <script>
      (function () {
        var theme = 'light';
        try {
          var storedTheme = window.localStorage.getItem('smart-inventory-theme:v1');
          theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (error) {
          try {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (mediaError) {
            theme = 'light';
          }
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var themeColor = theme === 'dark' ? '#08111f' : '#f6f8fb';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', themeColor);
        });
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
